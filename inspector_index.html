<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StayVerified inspector form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#122021;--green:#2b7124;--deep:#1b4d17;--gold:#fac514;--paper:#f3f6f1;--line:#d3dccd;--mute:#56665a;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:4px solid var(--gold)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
header img{height:44px;width:auto;display:block}
header span{font:600 15px Sora,system-ui,sans-serif;color:var(--deep)}
main{padding:20px 0 56px}
section{background:#fff;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:6px;padding:18px 16px;margin-bottom:18px}
h2{font:700 19px Sora,system-ui,sans-serif;margin:0 0 4px}
h3{font:600 16px Sora,system-ui,sans-serif;margin:0 0 8px}
.hint{margin:0 0 8px;color:var(--mute);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #b3c0ae;border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.item textarea{margin-top:8px}
.ih{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ih input{font:600 16px Sora,system-ui,sans-serif;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0;flex:1}
.rm{flex:none;width:40px;height:40px;background:none;border:0;color:var(--mute);font-size:24px;line-height:1;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 88px;min-height:44px;border:1.5px solid #b3c0ae;background:#fff;border-radius:6px;font:600 14px Figtree,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on[data-v=match],.seg button.on[data-v=present]{background:var(--green);border-color:var(--green)}
.seg button.on[data-v=partial]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.seg button.on[data-v=none],.seg button.on[data-v=absent]{background:var(--red);border-color:var(--red)}
.rate{display:flex;gap:4px;margin-top:12px}
.rate button{flex:1;height:40px;border:0;border-radius:3px;background:#e2e9de;cursor:pointer;padding:0}
.rate button.on{background:var(--c)}
.rlab{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:13px;color:var(--mute)}
.rlab b{color:var(--ink)}
.add{margin-top:12px;background:none;border:1.5px dashed var(--green);color:var(--deep);border-radius:6px;padding:10px 14px;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer}
.near{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.near .rm{justify-self:end;align-self:center}
.bad{border-color:var(--red)!important}
.item.bad{border-left:4px solid var(--red);padding-left:10px;background:#fdf4f3}
.send{width:100%;min-height:54px;background:var(--green);color:#fff;border:0;border-radius:8px;font:700 17px Sora,system-ui,sans-serif;cursor:pointer}
.send:disabled{opacity:.6;cursor:default}
#msg{margin:12px 0 0;font-weight:600}
.err{color:var(--red)}.ok{color:var(--green)}
#again{display:none}
</style>
</head>

<main class="wrap"><div id="form"></div></main>
<script>
const WEBHOOK_URL = ""; // paste the Make.com webhook URL here
const RL = ["Poor","Weak","Below par","Acceptable","Good","Very good","Excellent"];
const RC = ["#b3261e","#c8402f","#d9722b","#e39a24","#d4b21c","#5f9a35","#2b7124"];
const MATCH = [["match","Match"],["partial","Partial match"],["none","No match"]];
const $ = s => document.querySelector(s);

const QP = new URLSearchParams(location.search);
const LINKED = {
  id: (QP.get("id")||"").trim(),
  property: (QP.get("property")||"").trim(),
  location: (QP.get("location")||"").trim(),
  hostName: (QP.get("hostName")||"").trim(),
  hostPhone: (QP.get("hostPhone")||"").trim(),
};
const KEY = "sv_inspector_draft_" + (LINKED.id || "manual");

function el(t,a,...k){const e=document.createElement(t);
  for(const [n,v] of Object.entries(a||{})){
    if(n==="class")e.className=v; else if(n.startsWith("on"))e.addEventListener(n.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(n,v);
  }
  k.flat().forEach(c=>e.append(c&&c.nodeType?c:String(c==null?"":c)));return e}

const blank=()=>({
  meta:{inspectionId:LINKED.id,inspectionDate:new Date().toISOString().slice(0,10),
        property:LINKED.property,location:LINKED.location},
  listing:["Address","Room count","Amenities","Photographs","Availability"].map(item=>({item,status:"",finding:""})),
  amenities:["Front desk","Swimming pool","Restaurant","Gym"].map(name=>({name,present:"",rating:0,note:""})),
  rooms:["Living area","Bedroom","Kitchen","Bathroom"].map(name=>({name,status:"",rating:0,note:""})),
  access:{airport:"",parking:"",road:"",gate:""},
  area:{impression:"",nearby:["Supermarket","Pharmacy","Hospital"].map(type=>({type,name:"",distance:""}))},
  visit:{host:"",access:"",smoke:"",extinguisher:"",other:""}
});
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
const S = load() || blank();
let timer; function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},400)}

function txt(o,k,x){x=x||{};
  const e=el(x.area?"textarea":"input",{type:x.area?false:(x.type||"text"),placeholder:x.ph||"","aria-label":x.ph||x.al||false,"data-m":x.req?1:false,readonly:x.locked?"readonly":false});
  e.value=o[k]||"";
  if(x.locked){e.style.background="#eef1ec";e.style.color="#3c483e";}
  e.addEventListener("input",()=>{o[k]=e.value;e.classList.remove("bad");save()});return e}

function seg(o,k,opts,after){
  const w=el("div",{class:"seg",role:"group"});
  const paint=()=>[...w.children].forEach(b=>b.classList.toggle("on",b.dataset.v===o[k]));
  opts.forEach(([v,l])=>w.append(el("button",{type:"button","data-v":v,onclick:()=>{o[k]=v;paint();if(after)after();save()}},l)));
  paint();return w}

function rate(o,k){
  const w=el("div"),bar=el("div",{class:"rate"}),lab=el("div",{class:"rlab"});
  const paint=()=>{
    [...bar.children].forEach((b,i)=>b.classList.toggle("on",i<o[k]));
    lab.innerHTML="";
    lab.append(el("span",{},"1 Poor"),el("b",{},o[k]?`${o[k]}/7 · ${RL[o[k]-1]}`:"Tap to rate"),el("span",{},"7 Excellent"));
  };
  RL.forEach((n,i)=>bar.append(el("button",{type:"button","aria-label":`${i+1} of 7, ${n}`,style:`--c:${RC[i]}`,onclick:()=>{o[k]=i+1;paint();save()}})));
  w.append(bar,lab);paint();return w}

let uid=0;
function f(label,node){
  const l=el("label",{},label);
  if(/^(INPUT|TEXTAREA)$/.test(node.tagName)){node.id="f"+(++uid);l.htmlFor=node.id}else node.setAttribute("aria-label",label);
  return el("div",{},l,node)}
const sec=(title,hint,...k)=>el("section",{},el("h2",{},title),hint?el("p",{class:"hint"},hint):"",...k);
const xbtn=fn=>el("button",{type:"button",class:"rm","aria-label":"Remove",onclick:fn},"×");

function list(host,arr,make,fresh,label){
  const draw=()=>{host.innerHTML="";arr.forEach((o,i)=>host.append(make(o,()=>{arr.splice(i,1);draw();save()})))};
  draw();
  return el("button",{type:"button",class:"add",onclick:()=>{arr.push(fresh());draw();save();const i=host.lastElementChild&&host.lastElementChild.querySelector("input");if(i)i.focus()}},label)}

function matchItem(o){
  const n=el("div",{class:"item"},el("h3",{},o.item),seg(o,"status",MATCH),
    txt(o,"finding",{area:1,ph:"Finding. Required if not a full match."}));
  n._o=o;n._k="listing";return n}

function amenity(o,rm){
  const r=el("div");const draw=()=>{r.innerHTML="";if(o.present==="present")r.append(rate(o,"rating"))};draw();
  const n=el("div",{class:"item"},el("div",{class:"ih"},txt(o,"name",{ph:"Amenity name"}),xbtn(rm)),
    seg(o,"present",[["present","Present"],["absent","Not present"]],draw),r,txt(o,"note",{area:1,ph:"Notes"}));
  n._o=o;n._k="amenity";return n}

function room(o,rm){
  const n=el("div",{class:"item"},el("div",{class:"ih"},txt(o,"name",{ph:"Room name"}),xbtn(rm)),
    seg(o,"status",MATCH),rate(o,"rating"),txt(o,"note",{area:1,ph:"Notes. Required if not a full match."}));
  n._o=o;n._k="room";return n}

const near=(o,rm)=>el("div",{class:"near"},txt(o,"type",{ph:"Type"}),txt(o,"name",{ph:"Name"}),txt(o,"distance",{ph:"Distance, e.g. 0.6 km"}),xbtn(rm));

const F=$("#form"),amH=el("div"),rmH=el("div"),nbH=el("div");
F.append(
  sec("Inspection details",
    LINKED.id ? "This inspection was opened from your assigned link. The ID and property details below are set and cannot be edited here."
              : "Use the Inspection ID you were given. Client details are not part of this form.",
    f("Inspection ID *",txt(S.meta,"inspectionId",{req:1,locked:!!LINKED.id})),
    f("Inspection date *",txt(S.meta,"inspectionDate",{type:"date",req:1})),
    f("Property (name or unit) *",txt(S.meta,"property",{req:1,locked:!!LINKED.property})),
    f("Location (area, city) *",txt(S.meta,"location",{req:1,locked:!!LINKED.location})),
    (LINKED.hostName||LINKED.hostPhone) ? el("div",{style:"margin-top:14px;padding:12px;background:#eef1ec;border-radius:6px;"},
      el("div",{style:"font-weight:700;font-size:13px;margin-bottom:4px;"},"Host contact, for on-site access"),
      el("div",{style:"font-size:14px;"},[LINKED.hostName,LINKED.hostPhone].filter(Boolean).join(" · "))
    ) : ""),
  sec("Listing match","Compare what you see on site with the online listing.",...S.listing.map(matchItem)),
  sec("Building amenities","Rate each amenity that is present.",amH,
    list(amH,S.amenities,amenity,()=>({name:"",present:"",rating:0,note:""}),"Add amenity")),
  sec("Rooms","One entry per room. Add or remove rooms to match the unit.",rmH,
    list(rmH,S.rooms,room,()=>({name:"",status:"",rating:0,note:""}),"Add room")),
  sec("Location and access",null,
    f("Airport distance",txt(S.access,"airport",{area:1})),
    f("Parking",txt(S.access,"parking",{area:1})),
    f("Road condition",txt(S.access,"road",{area:1})),
    f("Gate access",txt(S.access,"gate",{area:1}))),
  sec("Neighbourhood",null,
    f("On-the-ground impression",txt(S.area,"impression",{area:1})),
    el("label",{},"Nearby amenities"),nbH,
    list(nbH,S.area.nearby,near,()=>({type:"",name:"",distance:""}),"Add place")),
  sec("Visit notes","These help the manager and the summary. Keep to what you observed.",
    f("Was the host present?",seg(S.visit,"host",[["yes","Yes"],["no","No"]])),
    f("Access to the unit",seg(S.visit,"access",[["full","Full"],["partial","Partial"],["none","None"]])),
    f("Smoke alarm test",seg(S.visit,"smoke",[["works","Works"],["fails","Not working"],["unchecked","Not checked"]])),
    f("Fire extinguisher last serviced",txt(S.visit,"extinguisher",{ph:"Year, or none found"})),
    f("Anything else worth noting",txt(S.visit,"other",{area:1}))),
  el("div",{},
    el("button",{id:"send",class:"send",type:"button"},"Send to manager"),
    el("p",{id:"msg",role:"status"}),
    el("button",{id:"again",class:"add",type:"button",onclick:()=>{localStorage.removeItem(KEY);location.reload()}},"Start a new inspection"))
);

function validate(){
  F.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  let first=null;const flag=e=>{e.classList.add("bad");first=first||e};
  F.querySelectorAll("[data-m]").forEach(i=>{if(!i.value.trim())flag(i)});
  F.querySelectorAll(".item").forEach(n=>{
    const o=n._o;if(!o)return;
    if(n._k==="listing"&&(!o.status||(o.status!=="match"&&!o.finding.trim())))flag(n);
    if(n._k==="room"&&(!o.name.trim()||!o.status||!o.rating||(o.status!=="match"&&!o.note.trim())))flag(n);
    if(n._k==="amenity"&&(!o.name.trim()||!o.present||(o.present==="present"&&!o.rating)))flag(n);
  });
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
  return !first}

function payload(){
  const meta=Object.fromEntries(Object.entries(S.meta).map(([k,v])=>[k,v.trim()]));
  return {version:1,submittedAt:new Date().toISOString(),linkedBookingId:LINKED.id||null,...meta,
    hostContact:{name:LINKED.hostName||"",phone:LINKED.hostPhone||""},
    listingMatch:S.listing,buildingAmenities:S.amenities,rooms:S.rooms,locationAccess:S.access,
    neighbourhood:{impression:S.area.impression,nearby:S.area.nearby.filter(n=>n.name.trim()||n.distance.trim())},
    visitNotes:S.visit}}

$("#send").addEventListener("click",async()=>{
  const msg=$("#msg"),b=$("#send");msg.className="";
  if(!validate()){msg.textContent="Complete the highlighted items. A partial or no match needs a note.";msg.className="err";return}
  b.disabled=true;msg.textContent="Sending…";
  const body=JSON.stringify(payload());
  try{
    if(!WEBHOOK_URL){
      const a=el("a",{href:URL.createObjectURL(new Blob([body],{type:"application/json"})),download:`inspection-${S.meta.inspectionId.trim()||"draft"}.json`});
      document.body.append(a);a.click();a.remove();
      msg.textContent="No webhook is set yet, so a JSON copy was downloaded for testing.";msg.className="ok";b.disabled=false;return}
    const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body});
    if(!r.ok)throw new Error(r.status);
    localStorage.removeItem(KEY);
    msg.textContent=`Sent to the manager. Inspection ID ${S.meta.inspectionId.trim()}.`;msg.className="ok";
    b.textContent="Sent";$("#again").style.display="inline-block";
  }catch(e){
    msg.textContent="Could not send. Check your connection and try again. Your answers are saved on this device.";msg.className="err";b.disabled=false}
});
</script>
</body>
</html>
